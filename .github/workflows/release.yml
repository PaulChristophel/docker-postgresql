name: Build, publish, and catalog PostgreSQL images

on:
  push:
    branches:
      - main
    paths:
      - "*.dockerfile"
      - "images.json"
      - "scripts/generate_catalogs.py"
      - ".github/workflows/release.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Load build matrix
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.matrix.outputs.image }}
      postgresql: ${{ steps.matrix.outputs.postgresql }}
      variants: ${{ steps.matrix.outputs.variants }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Read image configuration
        id: matrix
        run: |
          echo "image=$(jq -r '.image' images.json)" >> "$GITHUB_OUTPUT"
          echo "postgresql=$(jq -c '.defaults as $defaults | [.postgresql[] | . + {pg_cron_version: (.pg_cron_version // $defaults.pg_cron_version), pg_cron_commit: (.pg_cron_commit // $defaults.pg_cron_commit), pg_cron_sha256: (.pg_cron_sha256 // $defaults.pg_cron_sha256), pgvector_version: (.pgvector_version // $defaults.pgvector_version), pgvector_commit: (.pgvector_commit // $defaults.pgvector_commit), pgvector_sha256: (.pgvector_sha256 // $defaults.pgvector_sha256)}]' images.json)" >> "$GITHUB_OUTPUT"
          echo "variants=$(jq -c '.language_versions as $languages | .distributions as $distributions | [.variants[] | . + {trust: (if .untrusted then "untrusted" else "trusted" end), python_version: (if .untrusted then $languages[.os].python else "not-installed" end), perl_version: (if .untrusted then $languages[.os].perl else "not-installed" end), tcl_version: (if .untrusted then $languages[.os].tcl else "not-installed" end), distribution: $distributions[.os].name, distribution_version: $distributions[.os].version, base: $distributions[.os].base}]' images.json)" >> "$GITHUB_OUTPUT"

  build:
    name: PostgreSQL ${{ matrix.postgresql.major }} ${{ matrix.variant.tag }}
    needs: prepare
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ needs.prepare.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        postgresql: ${{ fromJSON(needs.prepare.outputs.postgresql) }}
        variant: ${{ fromJSON(needs.prepare.outputs.variants) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: pcm0
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record build timestamp
        id: build-time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.postgresql.version }}-${{ matrix.variant.tag }}
            type=raw,value=${{ matrix.postgresql.major }}-${{ matrix.variant.tag }}
            type=raw,value=latest,enable=${{ matrix.postgresql.major == 18 && matrix.variant.tag == 'standard-photon5' }}
            type=sha,prefix=${{ matrix.postgresql.major }}-${{ matrix.variant.tag }}-sha-
          annotations: |
            org.opencontainers.image.title=CloudNativePG PostgreSQL ${{ matrix.postgresql.version }} (${{ matrix.variant.tag }})
            org.opencontainers.image.description=PostgreSQL ${{ matrix.postgresql.version }} built from upstream source for CloudNativePG using the ${{ matrix.variant.tag }} variant.
            org.opencontainers.image.authors=Paul Christophel <pmartin@gatech.edu>
            org.opencontainers.image.vendor=Paul Christophel
            org.opencontainers.image.source=https://github.com/PaulChristophel/docker-postgresql
            org.opencontainers.image.url=https://hub.docker.com/r/pcm0/postgres
            org.opencontainers.image.documentation=https://github.com/PaulChristophel/docker-postgresql#readme
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build-time.outputs.created }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ matrix.postgresql.version }}
            org.opencontainers.image.ref.name=${{ env.IMAGE_NAME }}:${{ matrix.postgresql.version }}-${{ matrix.variant.tag }}
            org.opencontainers.image.base.name=${{ matrix.variant.base }}
            org.opencontainers.image.component.postgresql.version=${{ matrix.postgresql.version }}
            org.opencontainers.image.component.pg_cron.version=${{ matrix.postgresql.pg_cron_version }}
            org.opencontainers.image.component.pg_cron.revision=${{ matrix.postgresql.pg_cron_commit }}
            org.opencontainers.image.component.pgvector.version=${{ matrix.postgresql.pgvector_version }}
            org.opencontainers.image.component.pgvector.revision=${{ matrix.postgresql.pgvector_commit }}
            org.opencontainers.image.component.pgaudit.version=${{ matrix.postgresql.pgaudit_version }}
            org.opencontainers.image.component.pgaudit.revision=${{ matrix.postgresql.pgaudit_commit }}
            org.opencontainers.image.component.python.version=${{ matrix.variant.python_version }}
            org.opencontainers.image.component.perl.version=${{ matrix.variant.perl_version }}
            org.opencontainers.image.component.tcl.version=${{ matrix.variant.tcl_version }}
            edu.gatech.image.owner=Paul Christophel <pmartin@gatech.edu>
            edu.gatech.image.repository=${{ env.IMAGE_NAME }}
            edu.gatech.image.variant.trust=${{ matrix.variant.trust }}
            edu.gatech.image.untrusted-languages=${{ matrix.variant.untrusted }}
            edu.gatech.image.os.distribution=${{ matrix.variant.distribution }}
            edu.gatech.image.os.version=${{ matrix.variant.distribution_version }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          build-args: |
            BASE=${{ matrix.variant.base }}
            PG_MAJOR=${{ matrix.postgresql.major }}
            PG_VERSION=${{ matrix.postgresql.version }}
            PG_SHA256=${{ matrix.postgresql.sha256 }}
            WITH_UNTRUSTED_LANGUAGES=${{ matrix.variant.untrusted }}
            PYTHON_VERSION=${{ matrix.variant.python_version }}
            PERL_VERSION=${{ matrix.variant.perl_version }}
            TCL_VERSION=${{ matrix.variant.tcl_version }}
            IMAGE_TRUST=${{ matrix.variant.trust }}
            IMAGE_DISTRIBUTION=${{ matrix.variant.distribution }}
            IMAGE_DISTRIBUTION_VERSION=${{ matrix.variant.distribution_version }}
            PG_CRON_VERSION=${{ matrix.postgresql.pg_cron_version }}
            PG_CRON_COMMIT=${{ matrix.postgresql.pg_cron_commit }}
            PG_CRON_SOURCE_SHA256=${{ matrix.postgresql.pg_cron_sha256 }}
            PGVECTOR_VERSION=${{ matrix.postgresql.pgvector_version }}
            PGVECTOR_COMMIT=${{ matrix.postgresql.pgvector_commit }}
            PGVECTOR_SOURCE_SHA256=${{ matrix.postgresql.pgvector_sha256 }}
            PGAUDIT_VERSION=${{ matrix.postgresql.pgaudit_version }}
            PGAUDIT_COMMIT=${{ matrix.postgresql.pgaudit_commit }}
            PGAUDIT_SOURCE_SHA256=${{ matrix.postgresql.pgaudit_sha256 }}
            IMAGE_REPOSITORY=${{ env.IMAGE_NAME }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ steps.build-time.outputs.created }}
          cache-from: type=gha,scope=postgres-${{ matrix.postgresql.major }}-${{ matrix.variant.tag }}
          cache-to: type=gha,mode=max,scope=postgres-${{ matrix.postgresql.major }}-${{ matrix.variant.tag }}

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/pcm0/postgres
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record published digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ env.IMAGE_NAME }}
          MAJOR: ${{ matrix.postgresql.major }}
          VARIANT: ${{ matrix.variant.tag }}
        run: |
          mkdir -p results
          jq -n \
            --argjson major "$MAJOR" \
            --arg variant "$VARIANT" \
            --arg image "$IMAGE" \
            --arg digest "$DIGEST" \
            '{major: $major, variant: $variant, image: $image, digest: $digest}' \
            > "results/${MAJOR}-${VARIANT}.json"

      - name: Upload digest result
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.postgresql.major }}-${{ matrix.variant.tag }}
          path: results/*.json
          if-no-files-found: error

  catalogs:
    name: Generate image catalogs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download digest results
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: results
          merge-multiple: true

      - name: Generate ClusterImageCatalog manifests
        run: |
          python3 scripts/generate_catalogs.py \
            --results results \
            --output image-catalogs

      - name: Upload generated catalogs
        uses: actions/upload-artifact@v7
        with:
          name: cluster-image-catalogs
          path: image-catalogs/*.yaml
          if-no-files-found: error

      - name: Create catalog update pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: image-catalogs/*.yaml
          branch: automation/update-image-catalogs
          commit-message: Update PostgreSQL image catalogs
          title: Update PostgreSQL image catalogs
          body: |
            Updates the CloudNativePG image catalogs with the immutable digests
            produced by the latest successful image release workflow.
          delete-branch: true

      - name: Approve and enable automatic merge
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PR_APPROVER_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --approve
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto
