name: Update PostgreSQL image configuration

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-postgresql-image-configuration
  cancel-in-progress: false

jobs:
  update-postgresql-releases:
    name: Update stable PostgreSQL releases
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update PostgreSQL source releases, checksums, and base images
        run: python3 scripts/update_postgresql_releases.py

      - name: Create configuration update pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: images.json
          branch: automation/update-postgresql-releases
          commit-message: "chore: update PostgreSQL source releases"
          title: "chore: update PostgreSQL source releases"
          body: |
            Updates stable PostgreSQL release versions and their official
            source-archive SHA-256 pins, plus every configured OCI base-image
            digest. Tumbleweed's rolling snapshot date is stamped with the
            current UTC date, in `images.json`.

            Preview releases and extension revisions are intentionally managed
            separately because they have distinct compatibility policies.
          delete-branch: true

      - name: Approve and enable automatic merge
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.PR_APPROVER_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          gh pr review "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --approve
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto
